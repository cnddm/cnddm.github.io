<!DOCTYPE html>

<!--
  ==========================================================================
   COMMENT MODIFIER CETTE PAGE
  --------------------------------------------------------------------------
   Tout ce qui est à personnaliser est signalé par :  <<< À REMPLIR >>>

   Pour un bouton, remplacez seulement le # entre les guillemets après href :
       href="#"   devient   href="https://instagram.com/mon-compte"

   Ne modifiez rien d'autre sur la ligne : le reste affiche le logo
   et la couleur officielle de la marque.

   Pour supprimer un réseau : effacez sa ligne entière, de <a jusqu'à </a>
   Pour en ajouter un : copiez la ligne voulue depuis index.original.html

   Mode d'emploi complet : voir le fichier README.md
  ==========================================================================
-->

<!-- Thème : theme-auto (suit le téléphone) / theme-light (clair) / theme-dark (sombre) -->
<html class="theme-auto" lang="fr">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- <<< À REMPLIR >>> Titre affiché dans l'onglet du navigateur -->
    <title>Mes liens</title>
    <link rel="icon" type="image/png" href="images/avatar.png">

    <!-- <<< À REMPLIR >>> Description affichée dans Google et lors des partages -->
    <meta name="description" content="Retrouvez tous mes liens au même endroit : Facebook, Instagram, YouTube et plus.">

    <!-- <<< À REMPLIR >>> Adresse définitive du site -->
    <link rel="canonical" href="https://PSEUDO.github.io">

    <!-- <<< À REMPLIR >>> Nom du propriétaire de la page -->
    <meta name="author" content="Mon Nom">

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

    <!-- <<< À REMPLIR >>> Aperçu lors d'un partage (WhatsApp, Messenger, Facebook…).
         Les deux adresses ci-dessous doivent être complètes (https://...). -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Mes liens">
    <meta property="og:description" content="Retrouvez tous mes liens au même endroit.">
    <meta property="og:url" content="https://PSEUDO.github.io">
    <meta property="og:image" content="https://PSEUDO.github.io/images/avatar@2x.png">
    <meta name="twitter:card" content="summary">

    <!-- Chargement des polices -->
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-800.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Feuilles de style -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

  </head>

<body>

    <div class="container">
        <div class="column">
          <main>

            <!-- <<< À REMPLIR >>> Photo de profil.
                 Remplacez images/avatar.png (128 x 128 px) et
                 images/avatar@2x.png (256 x 256 px) en gardant ces noms.
                 Forme : avatar--rounded (rond) / avatar--soft (arrondi) / avatar--none (carré) -->
            <img class="avatar avatar--rounded" src="images/avatar.png" srcset="images/avatar@2x.png 2x" alt="Photo de profil" width="128" height="128" fetchpriority="high">

            <!-- <<< À REMPLIR >>> Nom ou nom de l'association -->
            <h1>Mon Nom</h1>

            <!-- <<< À REMPLIR >>> Courte phrase de présentation -->
            <p>Tous mes liens au même endroit.</p>

            <nav class="button-stack" aria-label="Liens">

              <!-- Facebook -->
              <a class="button button-faceb" href="#" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/facebook.svg" alt="Logo Facebook">Facebook</a>

              <!-- Instagram -->
              <a class="button button-instagram" href="#" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/instagram.svg" alt="Logo Instagram">Instagram</a>

              <!-- YouTube -->
              <a class="button button-yt" href="#" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/youtube.svg" alt="Logo YouTube">YouTube</a>

              <!-- TikTok -->
              <a class="button button-tiktok" href="#" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/tiktok.svg" alt="Logo TikTok">TikTok</a>

              <!-- X (anciennement Twitter) -->
              <a class="button button-x" href="#" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/x.svg" alt="Logo X">X</a>

              <!-- WhatsApp -->
              <a class="button button-whatsapp" href="#" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/whatsapp.svg" alt="Logo WhatsApp">WhatsApp</a>

              <!-- LinkedIn -->
              <a class="button button-linked" href="#" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/linkedin.svg" alt="Logo LinkedIn">LinkedIn</a>

              <!-- Bouton libre : site internet, boutique, billetterie, document… -->
              <a class="button button-default" href="#" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/littlelink.svg" alt="Logo">Notre site</a>

            </nav>
      </main>

      <footer>
        <a href="privacy.html">Confidentialité</a> | Propulsé par <a href="https://littlelink.io" target="_blank" rel="noopener">LittleLink</a>
      </footer>

    </div>
  </div>

</body>

</html>
